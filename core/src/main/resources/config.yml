# =============================================================================
#  Tradewind — конфигурация.
#
#  version — версия схемы файла. Не меняйте вручную: при устаревшей схеме плагин
#  сохранит резервную копию (config.yml.bak-vN) и создаст файл с актуальными
#  безопасными значениями по умолчанию.
# =============================================================================
version: 1

general:
  # Подробные сообщения в консоли: загрузка, перезагрузка, зависимости.
  debug: false

dependencies:
  # true  — нет обязательной зависимости => плагин выключается с понятным
  #         сообщением в консоли.
  # false — урезанный режим: работают только функции, которым хватает
  #         установленных плагинов.
  fail-fast: true
  # Предупреждать об отсутствии мягких зависимостей (TAB).
  warn-on-missing-optional: true

economy:
  # Валюта только через Vault (обязательная зависимость).
  currency-name: "монеты"
  # Знаков после запятой при расчёте зарплаты и сдачи: 0–4.
  round-to: 2

# -----------------------------------------------------------------------------
#  Хранилище статистики. Читается уже на этапе 1, используется с этапа 3,
#  чтобы схема конфига не менялась между этапами.
# -----------------------------------------------------------------------------
storage:
  # sqlite | mysql | mariadb
  type: sqlite
  sqlite:
    file: tradewind.db
  mysql:
    host: 127.0.0.1
    port: 3306
    database: tradewind
    user: tradewind
    password: ""
    use-ssl: true
    pool-size: 4

# -----------------------------------------------------------------------------
#  Пять профессий. Регионы WorldGuard обрабатываются на этапе 2.
#  region — имя региона WorldGuard, закреплённого за профессией.
#  salary — множитель зарплаты за действия в регионе (этап 3).
# -----------------------------------------------------------------------------
professions:
  mine:
    enabled: true
    display: "Шахтёр"
    region: "tw_mine"
    salary: 1.0
  farm:
    enabled: true
    display: "Фермер"
    region: "tw_farm"
    salary: 1.0
  wood:
    enabled: true
    display: "Лесоруб"
    region: "tw_wood"
    salary: 1.0
  fish:
    enabled: true
    display: "Рыбак"
    region: "tw_fish"
    salary: 1.0
  snow:
    enabled: true
    display: "Снеговик"
    region: "tw_snow"
    salary: 1.0

# -----------------------------------------------------------------------------
#  Скупщик ресурсов (этапы 4, 7, 8). На этапе 1 значения только читаются.
# -----------------------------------------------------------------------------
buyer:
  enabled: false
  rows: 6
  title: "<dark_gray>Скупщик"
  autosell: false

levels:
  enabled: false

boosts:
  enabled: false

