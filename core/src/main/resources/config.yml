# =============================================================================
#  Tradewind — конфигурация.
#
#  version — версия схемы. Не меняйте вручную: при устаревшей схеме плагин
#  сохранит резервную копию (config.yml.bak-vN) и создаст файл с актуальными
#  безопасными значениями по умолчанию.
# =============================================================================
version: 2

general:
  # Подробные сообщения в консоли: загрузка, перезагрузка, зависимости, пропуски наград.
  debug: false

dependencies:
  # true  — нет обязательной зависимости => плагин выключается с понятным
  #         сообщением в консоли.
  # false — урезанный режим: работают только функции, которым хватает
  #         установленных плагинов.
  fail-fast: true
  # Предупреждать об отсутствии мягких зависимостей (TAB).
  warn-on-missing-optional: true

economy:
  # Валюта только через Vault (обязательная зависимость).
  currency-name: "монеты"
  # Знаков после запятой при расчёте зарплаты и сдачи: 0–4.
  round-to: 2

# -----------------------------------------------------------------------------
#  Хранилище статистики. sqlite — без внешних сервисов; mysql/mariadb — общий
#  сервер для сети. Драйвер MariaDB встроен и работает с MySQL 5.7+/8.0.
#  Смена type применяется только после перезапуска сервера.
# -----------------------------------------------------------------------------
storage:
  type: sqlite
  # Как часто сбрасывать изменённые профили на диск, секунды.
  flush-interval-seconds: 30
  sqlite:
    file: tradewind.db
  mysql:
    host: 127.0.0.1
    port: 3306
    database: tradewind
    user: tradewind
    password: ""
    use-ssl: true

# -----------------------------------------------------------------------------
#  Пять профессий. Награда начисляется только за действия в регионе своей
#  профессии (регионы WorldGuard), с учётом выбранной профессии игрока.
#
#  blocks — список материалов; пустой список = безопасный набор по умолчанию.
#  work cooldown и анти-эксплойт — в секции anti-exploit.
# -----------------------------------------------------------------------------
professions:
  # Разрешать смену профессии после выбора.
  allow-change: true
  # Пауза между сменами профессии.
  change-cooldown: "1h"

  mine:
    enabled: true
    display: "Шахтёр"
    region: "tw_mine"
    salary-per-action: 3.0
    xp-per-action: 2
    blocks: []
  farm:
    enabled: true
    display: "Фермер"
    region: "tw_farm"
    salary-per-action: 2.5
    xp-per-action: 2
    blocks: []
  wood:
    enabled: true
    display: "Лесоруб"
    region: "tw_wood"
    salary-per-action: 2.0
    xp-per-action: 1
    blocks: []
  fish:
    enabled: true
    display: "Рыбак"
    region: "tw_fish"
    salary-per-action: 4.0
    xp-per-action: 3
    blocks: []
  snow:
    enabled: true
    display: "Снеговик"
    region: "tw_snow"
    salary-per-action: 1.5
    xp-per-action: 1
    blocks: []

# -----------------------------------------------------------------------------
#  Защита от эксплойтов. Значения по умолчанию рассчитаны на человека
#  с зажатой кнопкой и не мешают нормальной игре.
# -----------------------------------------------------------------------------
anti-exploit:
  # Награда только внутри региона профессии. false = весь мир (не рекомендуется).
  require-region: true
  # Не платить в креативе/наблюдении.
  deny-creative: true
  # Минимальная пауза между начислениями одному игроку.
  min-action-interval-ms: 75
  # Жёсткий потолок начислений в секунду.
  max-actions-per-second: 8
  # Не платить за блоки, поставленные игроками (place-break фермы).
  # Для профессии farm проверяется зрелость культуры, а не происхождение блока.
  track-placed-blocks: true
  placed-block-ttl: "15m"
  # Право, снимающее игрока с начислений (тесты, персонал).
  bypass-permission: "tradewind.bypass"
  # Пауза между продажами скупщику.
  buyer-cooldown: "1500ms"
  max-buyer-sales-per-minute: 20

# -----------------------------------------------------------------------------
#  Уровни. Опыт копится в пределах профессии; порог следующего уровня =
#  base-xp * level^exponent, зарплата растёт на salary-per-level за уровень.
# -----------------------------------------------------------------------------
levels:
  enabled: true
  max-level: 100
  base-xp: 100
  exponent: 1.35
  salary-per-level: 0.02
  # Разовая денежная награда за достижение уровня.
  rewards:
    5: 500
    10: 2000
    25: 10000
    50: 50000

# -----------------------------------------------------------------------------
#  Скупщик (GUI /buyer). Цены — в prices.yml.
# -----------------------------------------------------------------------------
buyer:
  enabled: true
  rows: 6
  title: "<dark_gray>Скупщик</dark_gray>"
  cooldown: "1500ms"
  # Стартовое состояние /autosell для новых игроков.
  autosell-default: false

